<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- SEO base (cada página sobreescribe con <Seo />) -->
    <title>Marco Balseca — Tehuacán, Puebla</title>
    <meta
      name="description"
      content="Marco Balseca, figura política y comunitaria de Tehuacán, Puebla. Cerca de la gente, por nuestra tierra. Súmate."
    />
    <meta name="author" content="Marco Balseca" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Marco Balseca" />
    <meta property="og:title" content="Marco Balseca — Tehuacán, Puebla" />
    <meta
      property="og:description"
      content="Figura política y comunitaria de Tehuacán, Puebla. Cerca de la gente, por nuestra tierra."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fuentes: display de cartel (Anton), condensada (Oswald), cuerpo (Inter), etiquetas mono (JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pesos recortados a lo realmente usado (400/500/600/700) y carga NO
         bloqueante (preload + swap): la página pinta de inmediato y las fuentes
         entran sin frenar el primer render. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Oswald:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Oswald:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Oswald:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Este sitio requiere JavaScript. Marco Balseca — Tehuacán, Puebla.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
